<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FinWise — Signup (WordPress-ready)</title>

  <!-- Tailwind CDN (optional) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- local stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="frame" id="finwise-frame">
  <div class="wrap">

    <!-- LEFT -->
    <div class="left ">
      <div class="brand">FinWise</div>

      <div class="blob" aria-hidden="true">
        <!-- HERO IMAGE (local assets folder) -->
        <img id="hero" src="assets/Vector5.png" alt="hero" />

        <!-- PLAY ICON (inline SVG recommended) -->
        <button class="play" aria-label="play">
          <!-- inline triangle SVG keeps it sharp -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 5v14l11-7L8 5z" fill="#fff"/>
          </svg>
        </button>
      </div>

      <div class="headline">
        Let’s Find the <span class="italic">Perfect</span><br/>
        <span class="adviser">Adviser for You.</span>
              <div class="sub">Answer a few quick questions and we'll match you.</div>

      </div>

    </div>

    <!-- RIGHT (placeholder interactive area) -->
    <div class="right">
      <div class="back" onclick="prevStep()">&larr; Back</div>
      <div id="stepTitle" class="title">What are you looking for help with?</div>

      <div class="content">
        <div id="dynamicArea"></div>
      </div>

      <div class="controls-wrap" style="margin-top:8px;">
        <div class="controls-left">
          <button id="nextBtn" class="btn" onclick="handleNext()" disabled>Next</button>
          <div class="step-pill">Step <span id="stepNum">1</span></div>
        </div>

        <div class="step-info">
          <div class="steps" id="progress">
            <div class="step-line" data-index="1"></div>
            <div class="step-line" data-index="2"></div>
            <div class="step-line" data-index="3"></div>
            <div class="step-line" data-index="4"></div>
            <div class="step-line" data-index="5"></div>
            <div class="step-line" data-index="6"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- local script -->
<script src="script.js"></script>
</body>
</html>
